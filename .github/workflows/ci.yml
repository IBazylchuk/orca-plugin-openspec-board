name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  private-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for private references
        run: |
          git fetch --quiet origin "${{ github.event.repository.default_branch }}" || true
          BASE_REF="origin/${{ github.event.repository.default_branch }}" scripts/check-no-private-refs.sh
